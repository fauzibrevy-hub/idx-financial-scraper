name: Smoke
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Byte-compile every module
        run: python3 -m py_compile run.py model/*.py
      - name: CLI help still loads
        run: python3 run.py --help
